name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 0'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Refresh tide cache
        continue-on-error: true
        env:
          NIWA_API_KEY: ${{ secrets.NIWA_API_KEY }}
        run: npm run tides
      - name: Refresh FareHarbor availability cache
        continue-on-error: true
        run: npm run fareharbor-availabilities
      - name: Log tide cache stats
        continue-on-error: true
        run: node -e "const j=require('./public/data/tides.json'); const h=(j.extremes||[]).filter(e=>e.type==='high').length; const l=(j.extremes||[]).filter(e=>e.type==='low').length; console.log('Tide cache:', j.extremes?.length||0, 'extremes', h, 'highs', l, 'lows', 'source:', j.metadata?.source||'none');"
      - name: Build for hackfarm.co.nz
        run: npm run build
        env:
          BASE_URL: /
          VITE_SITE_ORIGIN: https://hackfarm.co.nz
      - name: Verify Pages files
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -f dist/CNAME
          grep -q 'hackfarm.co.nz' dist/CNAME
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          test -f dist/llms.txt
          test -f dist/BingSiteAuth.xml
          grep -q '7A483AA50FC8C07106E5E9E40687CB5C' dist/BingSiteAuth.xml
          test -f dist/about/index.html
          test -f dist/accommodation/index.html
          test -f dist/horse/donnie/index.html
          grep -q 'src="/assets/' dist/index.html
          ! grep -q 'src="/hackfarm/assets/' dist/index.html
          grep -q 'https://hackfarm.co.nz/' dist/sitemap.xml
          grep -q 'https://hackfarm.co.nz/about/' dist/sitemap.xml
          grep -q 'https://hackfarm.co.nz/horse/donnie/' dist/sitemap.xml
          grep -q 'https://hackfarm.co.nz/sitemap.xml' dist/robots.txt
          ! grep -q 'github.io' dist/sitemap.xml
          ! grep -q '/hackfarm/' dist/sitemap.xml
          grep -q 'GPTBot' dist/robots.txt
          grep -q 'Hack n Stay Golden Bay' dist/llms.txt
          grep -q 'application/ld+json' dist/index.html
          grep -q 'About Hack n Stay' dist/about/index.html
          grep -q 'FAQPage' dist/accommodation/index.html
          grep -q 'sunrise and tide Ride Planner' dist/holistic-horse-rides/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep custom domain on Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"cname":"hackfarm.co.nz"}' | gh api --method PUT repos/${{ github.repository }}/pages --input -
