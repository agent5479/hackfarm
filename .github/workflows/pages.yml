name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Refresh tide cache
        continue-on-error: true
        env:
          NIWA_API_KEY: ${{ secrets.NIWA_API_KEY }}
        run: npm run tides
      - name: Build for github.io/hackfarm
        run: npm run build
        env:
          BASE_URL: /hackfarm/
      - name: Verify Pages files
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test ! -f dist/CNAME
          grep -q 'src="/hackfarm/assets/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Keep github.io preview (no custom domain yet)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo '{"cname":null}' | gh api --method PUT repos/${{ github.repository }}/pages --input -
